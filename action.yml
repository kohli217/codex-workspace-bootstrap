name: "Codex Workspace Bootstrap"
description: "Preflight AI coding repositories with readiness checks, instruction discovery, risk signals, and SARIF."
author: "kohli217"

inputs:
  path:
    description: "Repository path to audit"
    required: false
    default: "."
  strict:
    description: "Fail the action when blocking findings are detected (true or false)"
    required: false
    default: "true"
  sarif:
    description: "Optional path for a SARIF 2.1.0 report"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Verify Python
      shell: bash
      run: python --version

    - name: Install codex-workspace-bootstrap
      shell: bash
      env:
        CWB_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$CWB_ACTION_PATH"

    - name: AI repository preflight
      shell: bash
      env:
        CWB_TARGET_PATH: ${{ inputs.path }}
        CWB_STRICT: ${{ inputs.strict }}
        CWB_SARIF_PATH: ${{ inputs.sarif }}
      run: |
        case "$CWB_STRICT" in
          true|false) ;;
          *)
            echo "strict must be 'true' or 'false'" >&2
            exit 2
            ;;
        esac

        report="$RUNNER_TEMP/cwb-preflight.md"
        cwb preflight "$CWB_TARGET_PATH" --markdown "$report"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"

        args=(audit)
        if [[ "$CWB_STRICT" == "true" ]]; then
          args+=(--strict)
        fi
        if [[ -n "$CWB_SARIF_PATH" ]]; then
          args+=(--sarif "$CWB_SARIF_PATH")
        fi
        args+=(-- "$CWB_TARGET_PATH")
        cwb "${args[@]}"

branding:
  icon: "check-circle"
  color: "green"
