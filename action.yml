name: "Codex Workspace Bootstrap"
description: "Audit a repository for Codex-ready project instructions, toolchain signals, and risky tracked filenames."
author: "kohli217"

inputs:
  path:
    description: "Repository path to audit"
    required: false
    default: "."
  strict:
    description: "Fail the action when blocking findings are detected"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Verify Python
      shell: bash
      run: python --version

    - name: Install codex-workspace-bootstrap
      shell: bash
      env:
        CWB_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$CWB_ACTION_PATH"

    - name: Audit repository
      shell: bash
      env:
        CWB_TARGET_PATH: ${{ inputs.path }}
        CWB_STRICT: ${{ inputs.strict }}
      run: |
        args=(audit "$CWB_TARGET_PATH")
        if [[ "$CWB_STRICT" == "true" ]]; then
          args+=(--strict)
        fi
        codex-workspace-bootstrap "${args[@]}"

branding:
  icon: "check-circle"
  color: "green"
