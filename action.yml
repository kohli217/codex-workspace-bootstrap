name: "Codex Workspace Bootstrap"
description: "Preflight AI coding repositories with readiness checks, instruction discovery, risk signals, and SARIF."
author: "kohli217"

inputs:
  path:
    description: "Repository path to audit"
    required: false
    default: "."
  strict:
    description: "Fail the action when blocking findings are detected (true or false)"
    required: false
    default: "true"
  fail_on_integrity:
    description: "Fail when AI instruction-integrity findings are detected (true or false)"
    required: false
    default: "false"
  sarif:
    description: "Optional path for a SARIF 2.1.0 report containing audit and instruction-integrity findings"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Verify Python
      shell: bash
      run: python --version

    - name: Install codex-workspace-bootstrap
      shell: bash
      env:
        CWB_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$CWB_ACTION_PATH"

    - name: AI repository preflight
      shell: bash
      env:
        CWB_TARGET_PATH: ${{ inputs.path }}
        CWB_STRICT: ${{ inputs.strict }}
        CWB_FAIL_ON_INTEGRITY: ${{ inputs.fail_on_integrity }}
        CWB_SARIF_PATH: ${{ inputs.sarif }}
      run: |
        for value_name in CWB_STRICT CWB_FAIL_ON_INTEGRITY; do
          value="${!value_name}"
          case "$value" in
            true|false) ;;
            *)
              echo "$value_name must be 'true' or 'false'" >&2
              exit 2
              ;;
          esac
        done

        report="$RUNNER_TEMP/cwb-preflight.md"
        preflight_args=(preflight "$CWB_TARGET_PATH" --markdown "$report")
        if [[ -n "$CWB_SARIF_PATH" ]]; then
          preflight_args+=(--sarif "$CWB_SARIF_PATH")
        fi
        if [[ "$CWB_STRICT" == "true" ]]; then
          preflight_args+=(--strict)
        fi
        if [[ "$CWB_FAIL_ON_INTEGRITY" == "true" ]]; then
          preflight_args+=(--fail-on-integrity)
        fi

        set +e
        cwb "${preflight_args[@]}"
        status=$?
        set -e

        if [[ -f "$report" ]]; then
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"

branding:
  icon: "check-circle"
  color: "green"
