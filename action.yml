name: "Codex Workspace Bootstrap"
description: "Preflight AI coding repositories with readiness checks, instruction discovery, risk signals, and SARIF."
author: "kohli217"

outputs:
  state:
    description: "Preflight readiness state: READY, NEEDS ATTENTION, or BLOCKED"
    value: ${{ steps.preflight.outputs.state }}
  instruction_findings:
    description: "Number of instruction-integrity findings"
    value: ${{ steps.preflight.outputs.instruction_findings }}
  blocking:
    description: "Number of blocking audit findings"
    value: ${{ steps.preflight.outputs.blocking }}
  warnings:
    description: "Number of audit warnings"
    value: ${{ steps.preflight.outputs.warnings }}

inputs:
  path:
    description: "Repository path to audit"
    required: false
    default: "."
  strict:
    description: "Fail the action when blocking findings are detected (true or false)"
    required: false
    default: "true"
  fail_on_integrity:
    description: "Fail when AI instruction-integrity findings are detected (true or false)"
    required: false
    default: "false"
  require_ready:
    description: "Fail unless the final preflight state is READY (true or false)"
    required: false
    default: "false"
  sarif:
    description: "Optional path for a SARIF 2.1.0 report containing audit and instruction-integrity findings"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Verify Python
      shell: bash
      run: python --version

    - name: Install codex-workspace-bootstrap
      shell: bash
      env:
        CWB_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$CWB_ACTION_PATH"

    - name: AI repository preflight
      id: preflight
      shell: bash
      env:
        CWB_TARGET_PATH: ${{ inputs.path }}
        CWB_STRICT: ${{ inputs.strict }}
        CWB_FAIL_ON_INTEGRITY: ${{ inputs.fail_on_integrity }}
        CWB_REQUIRE_READY: ${{ inputs.require_ready }}
        CWB_SARIF_PATH: ${{ inputs.sarif }}
      run: |
        for value_name in CWB_STRICT CWB_FAIL_ON_INTEGRITY CWB_REQUIRE_READY; do
          value="${!value_name}"
          case "$value" in
            true|false) ;;
            *)
              echo "$value_name must be 'true' or 'false'" >&2
              exit 2
              ;;
          esac
        done

        report="$RUNNER_TEMP/cwb-preflight.md"
        json_report="$RUNNER_TEMP/cwb-preflight.json"
        preflight_args=(preflight "$CWB_TARGET_PATH" --markdown "$report" --json "$json_report")
        if [[ -n "$CWB_SARIF_PATH" ]]; then
          preflight_args+=(--sarif "$CWB_SARIF_PATH")
        fi
        if [[ "$CWB_STRICT" == "true" ]]; then
          preflight_args+=(--strict)
        fi
        if [[ "$CWB_FAIL_ON_INTEGRITY" == "true" ]]; then
          preflight_args+=(--fail-on-integrity)
        fi
        if [[ "$CWB_REQUIRE_READY" == "true" ]]; then
          preflight_args+=(--require-ready)
        fi

        set +e
        cwb "${preflight_args[@]}"
        status=$?
        set -e

        if [[ -f "$report" ]]; then
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -f "$json_report" ]]; then
          CWB_JSON_REPORT="$json_report" python - <<'PY'
        import json
        import os
        from pathlib import Path

        report = json.loads(Path(os.environ["CWB_JSON_REPORT"]).read_text(encoding="utf-8"))
        summary = report.get("summary", {})
        instruction_summary = report.get("instruction_summary", {})
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            print(f"state={report.get('state', '')}", file=output)
            print(f"instruction_findings={instruction_summary.get('findings', 0)}", file=output)
            print(f"blocking={summary.get('blocking', 0)}", file=output)
            print(f"warnings={summary.get('warnings', 0)}", file=output)
        PY
        fi

        exit "$status"

branding:
  icon: "check-circle"
  color: "green"
