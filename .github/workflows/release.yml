name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic version format such as v0.1.0"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Verify package version matches tag
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = data["project"]["version"]
          requested_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if project_version != requested_version:
              raise SystemExit(
                  f"pyproject.toml version {project_version!r} does not match "
                  f"requested tag {requested_version!r}"
              )

      - name: Install build and test tools
        run: python -m pip install --upgrade build pytest

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Run self-audit
        run: python -m codex_workspace_bootstrap audit . --strict

      - name: Build distributions
        run: python -m build

      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
