name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic version format such as v0.3.0"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify package version matches tag
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != tag_version:
              raise SystemExit(f"package version {version!r} does not match tag {tag_version!r}")

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codex-workspace-bootstrap/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
