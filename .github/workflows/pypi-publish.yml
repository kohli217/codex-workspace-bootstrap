name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.6.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codex-workspace-bootstrap/
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download exact distributions from triggering Release run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        id: release_tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$MANUAL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic version format such as v0.6.1"
            exit 1
          fi
          echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.13"

      - name: Verify manual package version matches tag
        if: github.event_name == 'workflow_dispatch'
        shell: python
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != tag_version:
              raise SystemExit(f"package version {version!r} does not match tag {tag_version!r}")

      - name: Build and validate distributions for manual recovery
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --require-hashes -r .github/requirements-release.txt
          python -m build
          python -m twine check dist/*

      - name: Verify publishable distribution set
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ "${#wheels[@]}" -ne 1 || "${#sdists[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel and one source distribution" >&2
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
