name: Generate hashed requirements

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install compatible pip-tools
        run: |
          python -m pip install pip==24.3.1
          python -m pip install pip-tools==7.5.1
      - name: Generate hash-locked requirements
        run: python -m piptools compile --generate-hashes --resolver=backtracking --output-file=.github/requirements-tools.txt .github/requirements-tools.in
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hashed-requirements
          path: .github/requirements-tools.txt
          if-no-files-found: error
