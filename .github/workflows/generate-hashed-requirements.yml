name: Generate hashed requirements

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Install compatible pip-tools
        run: |
          python -m pip install pip==24.3.1
          python -m pip install pip-tools==7.5.1
      - name: Generate Ubuntu test lock
        run: python -m piptools compile --generate-hashes --resolver=backtracking --output-file=requirements-test-ubuntu.txt .github/requirements-test.in
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requirements-test-ubuntu
          path: requirements-test-ubuntu.txt

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Install compatible pip-tools
        run: |
          python -m pip install pip==24.3.1
          python -m pip install pip-tools==7.5.1
      - name: Generate Windows test lock
        run: python -m piptools compile --generate-hashes --resolver=backtracking --output-file=requirements-test-windows.txt .github/requirements-test.in
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requirements-test-windows
          path: requirements-test-windows.txt

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install compatible pip-tools
        run: |
          python -m pip install pip==24.3.1
          python -m pip install pip-tools==7.5.1
      - name: Generate release lock
        run: python -m piptools compile --generate-hashes --resolver=backtracking --output-file=requirements-release.txt .github/requirements-release.in
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requirements-release
          path: requirements-release.txt

  commit:
    needs: [ubuntu-test, windows-test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: requirements-test-ubuntu
          path: .github
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: requirements-test-windows
          path: .github
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: requirements-release
          path: .github
      - name: Commit generated locks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/requirements-test-ubuntu.txt .github/requirements-test-windows.txt .github/requirements-release.txt
          if git diff --cached --quiet; then
            echo "Lock files are already current."
          else
            git commit -m "build: add OS-specific hash locks"
            git push origin HEAD:${{ github.head_ref }}
          fi
