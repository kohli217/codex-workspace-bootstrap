name: Generate hashed requirements

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install compatible pip-tools
        run: |
          python -m pip install pip==24.3.1
          python -m pip install pip-tools==7.5.1
      - name: Generate hash-locked requirements
        run: python -m piptools compile --generate-hashes --resolver=backtracking --output-file=.github/requirements-tools.txt .github/requirements-tools.in
      - name: Commit generated lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/requirements-tools.txt
          if git diff --cached --quiet; then
            echo "Lock file is already current."
          else
            git commit -m "build: add hash-locked Python workflow tools"
            git push origin HEAD:${{ github.head_ref }}
          fi
