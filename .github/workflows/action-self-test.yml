name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  action-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Run local action in strict mode with SARIF output
        uses: ./
        with:
          path: .
          strict: "true"
          fail_on_integrity: "true"
          sarif: action-report.sarif
      - name: Validate SARIF file
        shell: python
        run: |
          import json
          from pathlib import Path

          report = Path("action-report.sarif")
          if not report.exists():
              raise SystemExit("SARIF report was not created")
          data = json.loads(report.read_text(encoding="utf-8"))
          if data.get("version") != "2.1.0":
              raise SystemExit("Unexpected SARIF version")
          driver = data["runs"][0]["tool"]["driver"]
          if driver.get("name") != "codex-workspace-bootstrap":
              raise SystemExit("Unexpected SARIF tool name")
