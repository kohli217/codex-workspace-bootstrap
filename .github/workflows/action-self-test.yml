name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  action-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Run local action in strict mode with SARIF output
        id: cwb
        uses: ./
        with:
          path: .
          strict: "true"
          fail_on_integrity: "true"
          sarif: action-report.sarif
      - name: Validate Action outputs
        shell: python
        env:
          CWB_STATE: ${{ steps.cwb.outputs.state }}
          CWB_INSTRUCTION_FINDINGS: ${{ steps.cwb.outputs.instruction_findings }}
          CWB_BLOCKING: ${{ steps.cwb.outputs.blocking }}
          CWB_WARNINGS: ${{ steps.cwb.outputs.warnings }}
        run: |
          import os

          if os.environ["CWB_STATE"] not in {"READY", "NEEDS ATTENTION", "BLOCKED"}:
              raise SystemExit(f"Unexpected state output: {os.environ['CWB_STATE']!r}")
          for name in ("CWB_INSTRUCTION_FINDINGS", "CWB_BLOCKING", "CWB_WARNINGS"):
              value = os.environ[name]
              if not value.isdigit():
                  raise SystemExit(f"{name} is not numeric: {value!r}")


      - name: Create failing integrity fixture
        shell: python
        run: |
          import json
          from pathlib import Path

          fixture = Path("action-integrity-fixture")
          fixture.mkdir()
          (fixture / "README.md").write_text("# fixture\n", encoding="utf-8")
          (fixture / ".gitignore").write_text(".venv/\n", encoding="utf-8")
          (fixture / "package.json").write_text(
              json.dumps(
                  {
                      "packageManager": "pnpm@10",
                      "scripts": {"test": "vitest"},
                  }
              ),
              encoding="utf-8",
          )
          (fixture / "pnpm-lock.yaml").write_text("lockfileVersion: '9.0'\n", encoding="utf-8")
          (fixture / "AGENTS.md").write_text("Run `npm test`.\n", encoding="utf-8")

      - name: Run local action against known integrity failure
        id: failing_integrity
        continue-on-error: true
        uses: ./
        with:
          path: action-integrity-fixture
          strict: "false"
          fail_on_integrity: "true"

      - name: Validate integrity gate failure
        if: always()
        shell: python
        env:
          STEP_OUTCOME: ${{ steps.failing_integrity.outcome }}
          CWB_STATE: ${{ steps.failing_integrity.outputs.state }}
          CWB_FINDINGS: ${{ steps.failing_integrity.outputs.instruction_findings }}
        run: |
          import os

          if os.environ["STEP_OUTCOME"] != "failure":
              raise SystemExit(
                  f"Expected integrity-gated Action to fail, got {os.environ['STEP_OUTCOME']!r}"
              )
          if os.environ["CWB_STATE"] != "NEEDS ATTENTION":
              raise SystemExit(f"Unexpected failing fixture state: {os.environ['CWB_STATE']!r}")
          findings = int(os.environ["CWB_FINDINGS"])
          if findings < 1:
              raise SystemExit("Expected at least one instruction-integrity finding")

      - name: Validate SARIF file
        shell: python
        run: |
          import json
          from pathlib import Path

          report = Path("action-report.sarif")
          if not report.exists():
              raise SystemExit("SARIF report was not created")
          data = json.loads(report.read_text(encoding="utf-8"))
          if data.get("version") != "2.1.0":
              raise SystemExit("Unexpected SARIF version")
          driver = data["runs"][0]["tool"]["driver"]
          if driver.get("name") != "codex-workspace-bootstrap":
              raise SystemExit("Unexpected SARIF tool name")
