name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Run tests
        run: pytest -q
      - name: Run self-preflight
        run: python -m codex_workspace_bootstrap preflight . --markdown preflight.md
      - name: Run self-audit
        run: python -m codex_workspace_bootstrap audit .

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Verify installed CLIs
        run: |
          codex-workspace-bootstrap --version
          cwb --version
          cwb preflight . --markdown preflight.md
          cwb audit .
