name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked workflow tools (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install --require-hashes -r .github/requirements-test-ubuntu.txt
      - name: Install hash-locked workflow tools (Windows)
        if: matrix.os == 'windows-latest'
        run: python -m pip install --require-hashes -r .github/requirements-test-windows.txt
      - name: Smoke CWB-local Wrangler toolchain on Windows
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deploy\cloudflare\deploy.ps1 -ToolchainOnly
      - name: Run tests
        run: pytest -q
      - name: Run reproducible first-run demo
        run: python examples/first-run-demo/run_demo.py
      - name: Run reproducible scoped monorepo demo
        run: python examples/scoped-monorepo-demo/run_demo.py
      - name: Run reproducible multi-agent Python demo
        run: python examples/multi-agent-python-demo/run_demo.py
      - name: Run self-preflight
        run: python -m codex_workspace_bootstrap preflight . --markdown preflight.md --fail-on-integrity
      - name: Preview safe fixes
        run: python -m codex_workspace_bootstrap fix .
      - name: Run self-audit
        run: python -m codex_workspace_bootstrap audit .

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install hash-locked workflow tools
        run: python -m pip install --require-hashes -r .github/requirements-release.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Verify installed CLIs
        run: |
          codex-workspace-bootstrap --version
          cwb --version
          cwb preflight . --markdown preflight.md --fail-on-integrity
          cwb fix .
          cwb audit .


  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Cloud Run deployment scripts
        run: bash -n deploy/cloudrun/*.sh
      - name: Test free Cloudflare gateway
        run: node --test deploy/cloudflare/test/*.test.mjs
      - name: Guard GitHub App worker src import path
        run: |
          grep -Fq "PYTHONPATH: src" .github/workflows/github-app-worker.yml
      - name: Validate free Windows deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("deploy/cloudflare/deploy.ps1", "deploy/cloudflare/rotate-setup-token.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Guard isolated Windows Wrangler toolchain
        shell: pwsh
        run: |
          $deploy = Get-Content "deploy/cloudflare/deploy.ps1" -Raw
          $rotate = Get-Content "deploy/cloudflare/rotate-setup-token.ps1" -Raw
          if ($deploy -notmatch "latest-v22\.x" -or $deploy -notmatch "SHASUMS256\.txt") {
            throw "deploy.ps1 must download and checksum-verify the isolated Node.js 22 toolchain."
          }
          if ($deploy -notmatch 'WranglerVersion = "4\.136\.1"' -or $rotate -notmatch 'WranglerVersion = "4\.136\.1"') {
            throw "Cloudflare deployment scripts must use the pinned Wrangler version."
          }
          if ($deploy -match "& npx\s" -or $rotate -match "& npx\s") {
            throw "Cloudflare deployment scripts must not fall back to the machine-wide npx."
          }
      - name: Build Cloud Run container
        run: docker build --tag cwb-cloud-run:test .
      - name: Verify ingress container health
        run: |
          container_id="$(docker run --detach --publish 18080:8080 --env CWB_GITHUB_APP_MODE=ingress cwb-cloud-run:test)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -q '"mode":"ingress"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
      - name: Verify worker container health
        run: |
          container_id="$(docker run --detach --publish 18081:8080 --env CWB_GITHUB_APP_MODE=worker cwb-cloud-run:test)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz | grep -q '"mode":"worker"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
